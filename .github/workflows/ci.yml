name: CI
on:
  push:
    branches:
    - main
    - master
    - dev
    paths:
    - .github/workflows/ci.yml
    - .github/workflows/deploy-dev.yml
    - .github/workflows/deploy-prod.yml
    - react/**
    - scripts/validate_artifacts.py
    - ip_data/**/01_harvest/**
    - ip_data/**/02_preprocess/**
    - ip_data/**/03_analysis/**
    - ip_data/**/04_postprocess/**
    - analysis/**
    - cli/**
    - pipeline/**
    - ecosystems/**
    - tests/**
    - requirements*.txt
    - ruff.toml
    - mypy.ini
    - main.py
  pull_request:
    branches:
    - main
    - master
    - dev
    paths:
    - .github/workflows/ci.yml
    - .github/workflows/deploy-dev.yml
    - .github/workflows/deploy-prod.yml
    - react/**
    - scripts/validate_artifacts.py
    - ip_data/**/01_harvest/**
    - ip_data/**/02_preprocess/**
    - ip_data/**/03_analysis/**
    - ip_data/**/04_postprocess/**
    - analysis/**
    - cli/**
    - pipeline/**
    - ecosystems/**
    - tests/**
    - requirements*.txt
    - ruff.toml
    - mypy.ini
    - main.py
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-dev.lock.txt
    - name: Install dev dependencies
      run: pip install -r requirements-dev.lock.txt
    - name: Run ruff check
      run: ruff check .
    - name: Run mypy
      run: mypy
  test-frontend:
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: react/package-lock.json
    - name: Install frontend dependencies
      run: npm ci
      working-directory: react
    - name: Generate frontend indexes
      run: npm run prebuild
      working-directory: react
    - name: Run frontend tests
      run: npm test -- --run
      working-directory: react
      env:
        CI: true
    - name: Build frontend artifact
      if: github.event_name == 'push'
      run: npm run build
      working-directory: react
    - name: Upload frontend artifact
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v7
      with:
        name: react-build
        path: react/build
  artifact-validation:
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-dev.lock.txt
    - name: Install dev dependencies
      run: pip install -r requirements-dev.lock.txt
    - name: Validate snapshot artifacts
      run: python scripts/validate_artifacts.py
  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-dev.lock.txt
    - name: Install dev dependencies
      run: pip install -r requirements-dev.lock.txt
    - name: Run pytest
      run: pytest
